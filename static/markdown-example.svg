<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Markdown image example</title>
  <desc id="description">A blue gradient card labelled Markdown image.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#168acd"/>
      <stop offset="1" stop-color="#7357d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#background)" rx="24"/>
  <text x="80" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="76" font-weight="700">Markdown image</text>
  <text x="84" y="310" fill="#ddecff" font-family="system-ui, sans-serif" font-size="32">A local static asset</text>
</svg>
